name: warmup

# Render 無料枠は15分無通信でスリープし、初回リクエストが30〜60秒かかる。
# 約13分ごとに /warmup を叩いてスリープを防ぎ、チャットの初回体感を改善する。
#
# 事前準備: リポジトリの Settings → Secrets and variables → Actions → Variables に
#   RENDER_URL = https://<your-service>.onrender.com   を登録する。

on:
  schedule:
    - cron: "*/13 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /warmup
        run: |
          if [ -z "${{ vars.RENDER_URL }}" ]; then
            echo "RENDER_URL variable is not set; skipping."
            exit 0
          fi
          curl -fsS --max-time 60 "${{ vars.RENDER_URL }}/warmup" && echo "" || echo "warmup ping failed (service may be cold-starting)"
